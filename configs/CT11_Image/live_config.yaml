# Live inference configuration for YOLO + PatchCore + Pixel 6 camera — CT11_Image module
# Run: python live_infer.py --config configs/CT11_Image/live_config.yaml
#
# Class taxonomy / expected counts / confidence thresholds mirror
# yolo/CT11_Image/infer_ct11_image.py — calibrate after live captures are available.

camera:
  url: "http://192.168.0.135:8080/shot.jpg"
  timeout: 1.5          # seconds per HTTP request
  retries: 2            # total attempts before giving up
  retry_delay: 0.5      # seconds between failed attempts
  pre_delay: 0.3        # seconds to wait before each capture (exposure safety margin)

preprocessing:
  # ROI crop in pixels: [x, y, width, height] — must match configs/CT11_Image/preprocess_config.yaml
  roi: [700, 1500, 900, 900]
  # Output resolution after crop + resize — must match the trained PatchCore model
  output_size: [1024, 1024]

yolo:
  weights: "models/yolo/CT11_Image/pcb_seg/weights/best.pt"
  conf: 0.25             # global confidence floor
  nms_iou: 0.20          # global NMS IoU threshold (lower = stricter deduplication)
  imgsz: 1280            # YOLO inference resolution
  # Classes (6): 0=Main IC  1=board  2=component  3=connector  4=resistor  5=screw
  class_names: ["Main IC", "board", "component", "connector", "resistor", "screw"]
  class_colors:          # BGR
    0: [255, 100,   0]   # Main IC   — orange
    1: [150, 150, 150]   # board     — gray (structural outline)
    2: [ 50, 180, 255]   # component — light blue
    3: [  0, 200,   0]   # connector — green
    4: [  0, 200, 200]   # resistor  — yellow
    5: [180,   0, 255]   # screw     — purple
  label_classes: [0, 2, 3, 5]   # skip board (structural) and resistor (40 is too many)
  class_conf:            # per-class confidence override (must be >= conf)
    0: 0.25              # Main IC
    1: 0.50              # board
    2: 0.25              # component
    3: 0.25              # connector
    4: 0.40              # resistor
    5: 0.25              # screw
  expected_counts:       # exact component count check — NG if any mismatch
    0: 2                 # Main IC
    2: 10                # component
    3: 1                 # connector
    4: 40                # resistor
    5: 1                 # screw
  suppress_classes: []   # no PatchCore-heatmap suppression for CT11_Image
  class_nms_iou: {}      # no per-class post-NMS overrides for CT11_Image
  suppress_dilation: 0
  board_class: "board"   # class name whose segmented outline masks the heatmap
  board_dilation: 20     # expand board mask outward by this many px before masking
  board_pad: 128         # gray-border pad before YOLO (models trained on padded images)

inference:
  device: "cuda"        # "cuda", "mps" (Apple Silicon), or "cpu"
  score_threshold: 190.0  # placeholder — calibrate after seeing scores

output:
  patchcore_model: "models/patchcore/CT11_Image/CT11_Image_WR50_L2-3_PS3_1024_m4_p0.1/models/mvtec_ir_module"
  captures_dir: "./captures/CT11_Image"      # raw phone photos, timestamped
  heatmaps_dir: "./results/live/CT11_Image"  # 3-panel result images, timestamped
