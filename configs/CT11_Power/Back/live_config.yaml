# Live inference configuration for YOLO + PatchCore + Pixel 6 camera — CT11_Power Back module
# Run: python live_infer.py --config configs/CT11_Power/Back/live_config.yaml
#
# Class taxonomy / expected counts / confidence thresholds are the real, already-calibrated
# values from yolo/CT11_Power/infer_ct11_back.py (offline batch-eval script) — not placeholders.

camera:
  url: "http://192.168.0.135:8080/shot.jpg"
  timeout: 1.5          # seconds per HTTP request
  retries: 2            # total attempts before giving up
  retry_delay: 0.5      # seconds between failed attempts
  pre_delay: 0.3        # seconds to wait before each capture (exposure safety margin)

preprocessing:
  # ROI crop in pixels: [x, y, width, height] — must match configs/CT11_Power/Back/preprocess_config.yaml
  roi: [700, 1600, 900, 900]
  # Output resolution after crop + resize — must match the trained PatchCore model
  output_size: [1024, 1024]

yolo:
  weights: "models/yolo/CT11_Power/Back/pcb_seg/weights/best.pt"
  conf: 0.25             # global confidence floor
  nms_iou: 0.20          # global NMS IoU threshold (lower = stricter deduplication)
  imgsz: 1280            # YOLO inference resolution
  # Classes (4): 0=board  1=component  2=connector  3=resistor -- no "Main IC" or "screw" for CT11 Back
  class_names: ["board", "component", "connector", "resistor"]
  class_colors:          # BGR
    0: [150, 150, 150]   # board     — gray (structural outline)
    1: [50, 180, 255]    # component — light blue
    2: [0, 200, 0]       # connector — green
    3: [0, 200, 200]     # resistor  — yellow
  label_classes: [1, 2]  # skip board (structural) and resistor labels (61 is too many)
  class_conf:            # per-class confidence override (must be >= conf)
    0: 0.50              # board
    1: 0.25              # component
    2: 0.25              # connector
    3: 0.60              # resistor
  expected_counts:       # exact component count check — NG if any mismatch
    1: 1                 # component
    2: 1                 # connector
    3: 61                # resistor
  suppress_classes: []   # no PatchCore-heatmap suppression for CT11_Power Back
  soft_count_classes: [3]  # resistor -- count mismatch flags for human review
                            # instead of forcing NG; PatchCore's score is the
                            # primary surface-defect signal now, since YOLO
                            # under-counts this dense/small class even on good boards
  class_nms_iou: {}      # no per-class post-NMS overrides for CT11_Power Back
  suppress_dilation: 0
  # NMS/masking tunables -- calibrate these against real captures via the debug
  # panel's drop_reason (it names which of these fired). Defaults if omitted
  # are the same values baked into live_infer.py, so this is optional.
  cross_class_nms_iou: 0.50       # class-agnostic IoU above which a lower-confidence
                                   # different-class box is dropped for overlapping a
                                   # higher-confidence one
  containment_thresh: 0.10        # mask-overlap ratio (relative to the smaller
                                   # detection's own area) above which a smaller
                                   # different-class detection sitting inside a bigger
                                   # one gets dropped (e.g. spurious resistor on Main IC)
  off_board_overlap_thresh: 0.50  # fraction of a non-board detection's own mask that
                                   # must fall inside the board outline to be trusted
                                   # (board-masking profiles only)
  board_class: "board"   # class name whose segmented outline masks the heatmap
  board_dilation: 10     # expand board mask outward by this many px before masking
  board_pad: 128         # gray-border pad before YOLO (models trained on padded images)

inference:
  device: "cuda"        # "cuda", "mps" (Apple Silicon), or "cpu"
  # Placeholder from infer_ct11_back.py's ANOMALY_THRESH -- calibrate against real
  # good/defect boards once live captures are available.
  score_threshold: 200.0

output:
  patchcore_model: "models/patchcore/CT11_Power/CT11_Back_WR50_L2-3_PS3_1024_m4_p0.1/models/mvtec_ir_module"
  captures_dir: "./captures/CT11_Power/Back"      # raw phone photos, timestamped
  heatmaps_dir: "./results/live/CT11_Power/Back"  # 3-panel result images, timestamped
