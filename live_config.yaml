# Live inference configuration for PatchCore + Pixel 6 camera
# Run: python live_infer.py --model_path results/IR_Module/<log_group>/models/mvtec_ir_module

camera:
  url: "http://192.168.0.135:8080/shot.jpg"
  timeout: 3.0          # seconds per HTTP request
  retries: 3            # total attempts before giving up
  retry_delay: 0.5      # seconds between failed attempts
  pre_delay: 0.3        # seconds to wait before each capture (exposure safety margin)

preprocessing:
  # ROI crop in pixels: [x, y, width, height] — must match preprocess_config.yaml
  roi: [640, 1620, 950, 820]
  # Output resolution after crop + resize — must match the trained model
  output_size: [1024, 1024]

inference:
  device: "cuda"         # "cuda" or "cpu"
  # Anomaly score threshold for OK/NG verdict in the heatmap.
  # Set to null to skip auto-labelling (heatmap will show "LIVE" in grey).
  score_threshold: null

output:
  captures_dir: "./captures"      # raw phone photos, timestamped
  heatmaps_dir: "./results/live"  # 3-panel heatmap images, timestamped
